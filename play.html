<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Play a free HTML5 browser game on King in the Game."><link rel="canonical" href="https://kinginthegame.com/play.html"><title>Play — King in the Game</title><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="/portal.css"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"><style>.play-page{max-width:1180px;margin:0 auto;padding:55px 20px 100px}.back-link{color:var(--lime);font:10px var(--mono);text-transform:uppercase;letter-spacing:.12em}.play-page h1{font:600 clamp(42px,6vw,76px)/.95 var(--display);letter-spacing:-.07em;margin:28px 0 8px}.play-meta{color:var(--muted);font-size:13px;margin:0 0 25px}.game-shell{background:#000;border:1px solid var(--line);aspect-ratio:16/9;box-shadow:0 20px 80px rgba(0,0,0,.35)}.game-shell iframe{width:100%;height:100%;border:0}.play-actions{display:flex;justify-content:space-between;align-items:center;margin-top:18px}.source{color:var(--muted);font:10px var(--mono);text-transform:uppercase}.source:hover{color:var(--lime)}@media(max-width:600px){.play-page{padding-top:35px}.play-actions{align-items:start;flex-direction:column;gap:17px}}</style></head><body><header class="portal-header"><a class="portal-brand" href="/"><img src="/favicon.svg" alt=""><span>King in the <b>Game</b><small>PLAY. DISCOVER. REPEAT.</small></span></a><nav><a href="/">Home</a><a href="/games.html">Catalog</a><a href="/about.html">About</a></nav></header><main class="play-page"><a class="back-link" href="/">← Back to games</a><h1 id="playTitle">Loading game…</h1><p class="play-meta" id="playMeta"></p><div class="game-shell"><iframe id="gameFrame" title="HTML5 game" allow="fullscreen" allowfullscreen></iframe></div><div class="play-actions"><span class="mono">PLAY IN YOUR BROWSER / NO DOWNLOAD · GAME HOSTED BY GAMEMONETIZE</span><a class="source" id="sourceLink" href="#" target="_blank" rel="noopener">View platform listing ↗</a></div></main><footer class="legal-footer"><a href="/privacy.html">Privacy</a><a href="/terms.html">Terms</a><a href="/contact.html">Contact</a></footer><script>fetch('/games.json').then(r=>{if(!r.ok)throw new Error('catalog unavailable');return r.json()}).then(games=>{const id=new URLSearchParams(location.search).get('game');const g=games.find(x=>x.id===id)||games[0];if(!g)throw new Error('game unavailable');document.title=`Play ${g.title} — King in the Game`;document.getElementById('playTitle').textContent=g.title;document.getElementById('playMeta').textContent=`${g.genre} · ${g.label}`;document.getElementById('gameFrame').src=g.embed;document.getElementById('sourceLink').href=g.source}).catch(()=>{document.getElementById('playTitle').textContent='Game unavailable';document.getElementById('playMeta').textContent='Please return to the catalog and try another title.'});</script></body></html>
